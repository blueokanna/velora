name: velora
description: "Velora 小说阅读器 —— 基于 flutter_rust_bridge 与 Material Design 3 的本地与在线阅读应用。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  rust_lib_velora:
    path: rust_builder
  flutter_rust_bridge: 2.12.0

  dynamic_color: ^1.7.0
  material_color_utilities: any
  google_fonts: ^6.3.3

  flutter_riverpod: ^3.3.1

  go_router: ^17.2.3

  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  file_picker: ^11.0.2
  permission_handler: ^12.0.1
  http: ^1.4.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.2

  collection: ^1.18.0
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/light.png
    - assets/dark.png
