[package]
name = "rust_lib_velora"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[test]]
name = "book_file_formats"
path = "../test/book_file_formats.rs"

[dependencies]
flutter_rust_bridge = "=2.12.0"
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "gzip",
    "brotli",
    "deflate",
    "charset",
    "http2",
    "rustls",
] }
encoding_rs = "0.8.35"
chardetng = "1.0.0"
regex = "1.12.3"
once_cell = "1.21.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
scraper = "0.27.0"
log = "0.4.30"
thiserror = "2.0.18"
anyhow = "1.0.102"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
roxmltree = "0.21.1"
base64 = "0.22.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
